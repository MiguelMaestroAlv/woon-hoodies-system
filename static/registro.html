<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WOON Hoodies - Registro de Clientes</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #fcfcfc;
            color: #000;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1, h2 { font-weight: 700; }

        .container { max-width: 800px; width: 100%; }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            gap: 15px;
            flex-wrap: wrap;
        }

        .nav-links { display: flex; gap: 12px; }

        .nav-btn {
            text-decoration: none;
            color: #000;
            background: #fff;
            border: 3px solid #000;
            border-radius: 10px;
            box-shadow: 4px 4px 0px #000;
            padding: 8px 16px;
            font-weight: 700;
            transition: transform 0.15s, box-shadow 0.15s;
        }

        .nav-btn.active {
            background: linear-gradient(90deg, #00c6ff 0%, #38ef7d 100%);
        }

        .nav-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px #000;
        }

        .form-section {
            background: #fff;
            border: 3px solid #000;
            border-radius: 20px;
            box-shadow: 6px 6px 0px #000;
            padding: 30px;
        }

        .rules-box {
            background: #fff8dc;
            border: 2px solid #000;
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0 20px 0;
            border: 3px solid #000;
            border-radius: 10px;
            font-family: 'Poppins', sans-serif;
            font-size: 16px;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            box-shadow: 4px 4px 0px #000;
        }

        button {
            background: linear-gradient(90deg, #00c6ff 0%, #38ef7d 100%);
            border: 3px solid #000;
            border-radius: 12px;
            box-shadow: 4px 4px 0px #000;
            padding: 12px 24px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            width: 100%;
            transition: all 0.2s;
        }

        button:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px #000;
        }

        .feedback {
            display: none;
            padding: 16px;
            border: 3px solid #000;
            border-radius: 12px;
            margin-top: 20px;
            font-weight: 600;
        }

        .feedback.ok { background: #38ef7d; color: #000; }
        .feedback.err { background: #f64f59; color: #fff; }
    </style>
</head>
<body>

<div class="container">
    <div class="navbar">
        <h1 style="margin: 0;">WOON Hoodies <span style="font-size: 24px;">🔥</span></h1>
        <div class="nav-links">
            <a href="/" class="nav-btn">Catálogo y Pedidos</a>
            <a href="/registro.html" class="nav-btn active">Registro de Clientes</a>
        </div>
    </div>

    <div class="form-section">
        <h2>Registro de Cliente</h2>
        <div class="rules-box">
            <strong>Reglas de contraseña:</strong> Entre 8 y 16 caracteres, al menos una letra mayúscula, al menos un número y sin espacios.
        </div>

        <label>Nombre completo:</label>
        <input type="text" id="nombre" placeholder="Ej. Miguel Maestro" required>

        <label>Correo electrónico:</label>
        <input type="email" id="correo" placeholder="Ej. miguel@woon.com" required>

        <label>Contraseña:</label>
        <input type="password" id="contrasena" placeholder="Ej. Woon2026" required>

        <button onclick="registrarCliente()">Registrar Cliente</button>

        <div id="feedback" class="feedback"></div>
    </div>
</div>

<script>
    const API_URL = "http://127.0.0.1:8000";

    async function registrarCliente() {
        const feedback = document.getElementById('feedback');
        const payload = {
            nombre: document.getElementById('nombre').value,
            correo: document.getElementById('correo').value,
            contrasena: document.getElementById('contrasena').value
        };

        const response = await fetch(`${API_URL}/clientes/`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        const data = await response.json();
        feedback.style.display = 'block';

        if (response.ok) {
            feedback.className = 'feedback ok';
            feedback.innerText = `✅ ${data.mensaje}: ${data.cliente}`;
        } else {
            feedback.className = 'feedback err';
            const msg = Array.isArray(data.detail) ? data.detail[0].msg : data.detail;
            feedback.innerText = `❌ Error: ${msg}`;
        }
    }
</script>
</body>
</html>
