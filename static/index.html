<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WOON Hoodies E-commerce</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #fcfcfc;
            color: #000;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1, h2 {
            font-weight: 700;
        }

        /* Estética Neo-brutalista basada en la referencia */
        .container {
            max-width: 800px;
            width: 100%;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .card {
            border: 3px solid #000;
            border-radius: 16px;
            box-shadow: 4px 4px 0px #000;
            padding: 20px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px #000;
        }

        /* Degradados vibrantes */
        .grad-purple { background: linear-gradient(135deg, #c471ed, #f64f59); color: white; }
        .grad-cyan { background: linear-gradient(135deg, #00c6ff, #0072ff); color: white; }
        .grad-orange { background: linear-gradient(135deg, #f12711, #f5af19); color: white; }
        .grad-green { background: linear-gradient(135deg, #11998e, #38ef7d); color: white; }

        .form-section {
            background: #fff;
            border: 3px solid #000;
            border-radius: 20px;
            box-shadow: 6px 6px 0px #000;
            padding: 30px;
            margin-bottom: 40px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin: 10px 0 20px 0;
            border: 3px solid #000;
            border-radius: 10px;
            font-family: 'Poppins', sans-serif;
            font-size: 16px;
            box-sizing: border-box;
        }

        input:focus, select:focus {
            outline: none;
            box-shadow: 4px 4px 0px #000;
        }

        button {
            background: linear-gradient(90deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            border: 3px solid #000;
            border-radius: 12px;
            box-shadow: 4px 4px 0px #000;
            padding: 12px 24px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            width: 100%;
            transition: all 0.2s;
        }

        button:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px #000;
        }

        .ticket {
            display: none;
            background: #000;
            color: #fff;
            padding: 20px;
            border-radius: 16px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>WOON Hoodies <span style="font-size: 24px;">🔥</span></h1>
    
    <h2>Catálogo</h2>
    <div class="card-grid" id="catalogo">
        <!-- Las hoodies se inyectarán aquí con JavaScript -->
    </div>

    <div class="form-section">
        <h2>Generar Pedido</h2>
        <label>ID del Cliente (Usa 1 si probaste con poblar.py):</label>
        <input type="number" id="cliente_id" placeholder="Ej. 1" required>

        <label>Selecciona tu Hoodie:</label>
        <select id="hoodie_id">
            <!-- Las opciones se inyectarán aquí -->
        </select>

        <label>Cantidad:</label>
        <input type="number" id="cantidad" placeholder="Ej. 2" required>

        <button onclick="generarPedido()">Confirmar Compra</button>

        <div id="ticket" class="ticket">
            <h3>¡Pedido Exitoso! 🎉</h3>
            <p>Subtotal: $<span id="t_subtotal"></span></p>
            <p>Descuento aplicado: $<span id="t_descuento"></span></p>
            <hr style="border-color: #444;">
            <h2>Total: $<span id="t_total"></span></h2>
        </div>
    </div>
</div>

<script>
    const API_URL = "http://127.0.0.1:8000";
    const gradients = ['grad-purple', 'grad-cyan', 'grad-orange', 'grad-green'];

    // Cargar Catálogo al iniciar
    async function cargarCatalogo() {
        const response = await fetch(`${API_URL}/hoodies/`);
        const hoodies = await response.json();
        
        const catalogoDiv = document.getElementById('catalogo');
        const selectSudadera = document.getElementById('hoodie_id');
        
        hoodies.forEach((hoodie, index) => {
            const colorClass = gradients[index % gradients.length];
            
            // Crear tarjeta visual
            const card = document.createElement('div');
            card.className = `card ${colorClass}`;
            card.innerHTML = `
                <h3>${hoodie.nombre}</h3>
                <p>Color: ${hoodie.color}</p>
                <p><strong>$${hoodie.precio}</strong></p>
            `;
            catalogoDiv.appendChild(card);

            // Agregar al select del formulario
            const option = document.createElement('option');
            option.value = hoodie.id;
            option.textContent = `${hoodie.nombre} - $${hoodie.precio}`;
            selectSudadera.appendChild(option);
        });
    }

    // Enviar el pedido
    async function generarPedido() {
        const payload = {
            cliente_id: parseInt(document.getElementById('cliente_id').value),
            hoodie_id: parseInt(document.getElementById('hoodie_id').value),
            cantidad: parseInt(document.getElementById('cantidad').value)
        };

        const response = await fetch(`${API_URL}/pedidos/`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        if (response.ok) {
            const data = await response.json();
            document.getElementById('t_subtotal').innerText = data.subtotal;
            document.getElementById('t_descuento').innerText = data.descuento_aplicado;
            document.getElementById('t_total').innerText = data.total;
            document.getElementById('ticket').style.display = 'block';
        } else {
            alert("Error al procesar el pedido. Verifica el ID del cliente y el stock.");
        }
    }

    cargarCatalogo();
</script>
</body>
</html>
